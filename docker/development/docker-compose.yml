# Development environment: PostgreSQL only.
#
# The Spring Boot application is NOT containerised here on purpose — run it from
# your IDE or `./mvnw spring-boot:run` so you keep hot reload and a debugger.
# This compose file exists only to give that local app a database to talk to.
#
#   cd docker/development && docker compose up -d
#
name: fcm-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: fcm-postgres-dev
    restart: unless-stopped
    ports:
      # Published so the app running on the host can reach it.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fcm}
      POSTGRES_USER: ${POSTGRES_USER:-fcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fcm} -d ${POSTGRES_DB:-fcm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: fcm-postgres-data-dev
