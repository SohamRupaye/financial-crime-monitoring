spring.application.name=financial-crime-monitoring

# --- Datasource -------------------------------------------------------------
# Development defaults, matching docker/development/docker-compose.yml.
# Production overrides these with SPRING_DATASOURCE_* environment variables set
# in docker/production/docker-compose.yml: Spring's relaxed binding maps
# SPRING_DATASOURCE_URL onto spring.datasource.url, so no profile file is needed.
# Tests ignore all of it — Testcontainers injects its own connection.
spring.datasource.url=jdbc:postgresql://localhost:5432/fcm
spring.datasource.username=fcm
spring.datasource.password=fcm

# --- Schema -----------------------------------------------------------------
# Flyway owns the schema; Hibernate only checks that its mappings match what
# Flyway built. `validate` fails fast on drift. Never use `update` (silently
# alters tables, never drops anything, drifts between environments) and never
# `create-drop` outside a throwaway database.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA --------------------------------------------------------------------
# Closes the persistence context when the service method returns, instead of
# holding it open until the response is written. Lazy-loading a collection in a
# serialiser then fails loudly in a test rather than quietly issuing N+1 queries
# in production. Boot warns if this is left unset.
spring.jpa.open-in-view=false

# Log SQL during development. `format_sql` makes it readable; bind parameters are
# visible via the logger below. Turn all of it off in production — it is slow and
# writes customer data into log files.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Never expose them all: /actuator/env and
# /actuator/heapdump hand out configuration and memory contents.
management.endpoints.web.exposure.include=health,info
# Fine for development. In production prefer `never` or `when-authorized`, since
# details include database connectivity and internal component names.
management.endpoint.health.show-details=always

# --- AML rules ---------------------------------------------------------------
# Thresholds, windows and weights for the rules engine, bound onto AmlProperties
# and validated at startup. These are the numbers a compliance function tunes, so
# they must not need a rebuild. Amounts are in the account's own currency; there
# is no FX conversion, which is why a transaction's currency has to match its
# account.

aml.large-amount.threshold=500000
aml.large-amount.points=25

aml.velocity.window=10m
aml.velocity.max-transactions=10
aml.velocity.points=20

# The floor has to stay below the large-amount threshold or nothing can qualify;
# StructuringRule refuses to start otherwise. 400000 is 80% of it - someone
# structuring aims just under the line, not far below it.
aml.structuring.window=24h
aml.structuring.near-threshold-floor=400000
aml.structuring.min-transactions=3
aml.structuring.points=30

# Every risk level needs an entry. CustomerRiskRule fails at startup on a gap,
# because a missing key would otherwise read as zero points.
aml.customer-risk.points.low=0
aml.customer-risk.points.medium=10
aml.customer-risk.points.high=20
aml.customer-risk.points.critical=30

# Placeholder codes only - AA, QM-QZ, XA-XZ and ZZ are the ranges ISO 3166-1
# reserves for private use and will never be assigned to a real country.
aml.country-risk.elevated-risk-countries=XA,XB,XC,QM
aml.country-risk.points=20
