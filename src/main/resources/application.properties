spring.application.name=financial-crime-monitoring

# --- Datasource -------------------------------------------------------------
# Development defaults, matching docker/development/docker-compose.yml. Production
# overrides these with SPRING_DATASOURCE_* environment variables; tests ignore
# them entirely, since Testcontainers injects its own connection.
spring.datasource.url=jdbc:postgresql://localhost:5432/fcm
spring.datasource.username=fcm
spring.datasource.password=fcm

# --- Schema -----------------------------------------------------------------
# Flyway owns the schema; Hibernate only checks that its mappings match. Never
# `update`, which silently alters tables and drifts between environments.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA --------------------------------------------------------------------
# Closes the persistence context when the service method returns rather than
# holding it open until the response is written, so a lazy load in a serialiser
# fails loudly in a test instead of issuing N+1 queries in production.
spring.jpa.open-in-view=false

# Development only. Turn all of it off in production - it is slow, and it writes
# customer data into log files.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- Actuator ---------------------------------------------------------------
# Health and info only. /actuator/env and /actuator/heapdump hand out
# configuration and memory contents.
management.endpoints.web.exposure.include=health,info
# Prefer `never` or `when-authorized` in production: details include database
# connectivity and internal component names.
management.endpoint.health.show-details=always

# --- AML rules ---------------------------------------------------------------
# Thresholds, windows and weights for the rules engine, bound onto AmlProperties
# and validated at startup. These are the numbers a compliance function tunes, so
# they must not need a rebuild. Amounts are in the account's own currency; there
# is no FX conversion, which is why a transaction's currency has to match its
# account.

aml.large-amount.threshold=500000
aml.large-amount.points=25

aml.velocity.window=10m
aml.velocity.max-transactions=10
aml.velocity.points=20

# The floor has to stay below the large-amount threshold or nothing can qualify;
# StructuringRule refuses to start otherwise. 400000 is 80% of it - someone
# structuring aims just under the line, not far below it.
aml.structuring.window=24h
aml.structuring.near-threshold-floor=400000
aml.structuring.min-transactions=3
aml.structuring.points=30

# Every risk level needs an entry. CustomerRiskRule fails at startup on a gap,
# because a missing key would otherwise read as zero points.
aml.customer-risk.points.low=0
aml.customer-risk.points.medium=10
aml.customer-risk.points.high=20
aml.customer-risk.points.critical=30

# Placeholder codes only - AA, QM-QZ, XA-XZ and ZZ are the ranges ISO 3166-1
# reserves for private use and will never be assigned to a real country.
aml.country-risk.elevated-risk-countries=XA,XB,XC,QM
aml.country-risk.points=20

# Score bands, as the lowest score that reaches each level. maxScore caps the
# total: the five rules can add up to 125, and a score that runs off the end of
# its own scale is not a score.
aml.scoring.max-score=100
aml.scoring.bands.low=0
aml.scoring.bands.medium=30
aml.scoring.bands.high=60
aml.scoring.bands.critical=80

# The score at which an assessment becomes somebody's job. Separate from the
# bands above on purpose: what band a score falls into and whether it needs a
# person are different decisions.
aml.alerting.threshold=60
